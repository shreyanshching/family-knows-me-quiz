<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Likely Scam 😁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .quiz-header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-header h1 {
            color: #333;
            font-size: 1.5em;
        }

        .quiz-header p {
            color: #666;
            font-size: 1.1em;
        }

        .progress-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
            font-weight: 500;
        }

        .progress-fill {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .question-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-text {
            color: #333;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            background: #efefef;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option input[type="radio"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option label {
            flex: 1;
            cursor: pointer;
            color: #333;
            font-weight: 500;
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.selected label {
            color: white;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
            padding: 12px 30px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #ccc;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Screen */
        .results-container {
            text-align: center;
            padding: 40px 30px;
        }

        .results-container h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        .score-number {
            font-size: 3em;
            color: white;
            font-weight: bold;
        }

        .score-text {
            color: white;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .score-percentage {
            font-size: 2em;
            color: #333;
            margin: 20px 0;
            font-weight: 600;
        }

        .message {
            font-size: 1.2em;
            color: #666;
            margin: 20px 0;
            line-height: 1.6;
        }

        .results-details {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .results-details p {
            color: #666;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .leaderboard-btn {
            background: #4caf50;
            color: white;
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .leaderboard-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        /* Matrix Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
        }

        .matrix-background {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.3;
            font-family: monospace;
            color: #0f0;
            font-size: 1.2em;
            line-height: 1.2;
            white-space: pre;
            overflow: hidden;
        }

        .matrix-text {
            animation: matrix-scroll 20s linear infinite;
        }

        @keyframes matrix-scroll {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        .matrix-char {
            display: inline-block;
            width: 100%;
        }

        .loading-content {
            position: relative;
            z-index: 100;
            text-align: center;
        }

        .hacked-message {
            color: #0f0;
            font-size: 4em;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            font-family: 'Courier New', monospace;
            animation: glow-pulse 0.5s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes glow-pulse {
            0%, 100% {
                text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            }
            50% {
                text-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 60px #0f0;
            }
        }

        .loading-text {
            color: #0f0;
            font-size: 1.5em;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
        }

        .joke-message {
            color: #0f0;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .presented-by {
            color: #0f0;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            margin-top: 30px;
            animation: fadeIn 1s ease-in 0.5s both;
        }

        /* Leaderboard Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 20px auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
            font-size: 1.8em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: #000;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .rank-badge {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
            color: #667eea;
        }

        .rank-badge.first {
            color: #ffd700;
            font-size: 2em;
        }

        .rank-badge.second {
            color: #c0c0c0;
            font-size: 2em;
        }

        .rank-badge.third {
            color: #cd7f32;
            font-size: 2em;
        }

        .leaderboard-info {
            flex: 1;
            margin-left: 15px;
        }

        .leaderboard-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .leaderboard-score {
            text-align: right;
            color: #667eea;
            font-weight: bold;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .quiz-header {
                flex-direction: column;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-number {
                font-size: 2em;
            }

            .hacked-message {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Loading Screen -->
    <div id="loadingScreen" class="loading-screen" style="display: none;">
        <div class="matrix-background" id="matrixBg"></div>
        <div class="loading-content">
            <div class="hacked-message" id="hackedMsg">YOU HAVE BEEN HACKED</div>
            <div class="loading-text" id="loadingText">Initializing Quiz System...</div>
            <div class="joke-message" id="jokeMsg" style="display: none;">Just Kidding! 😄</div>
            <div class="presented-by" id="presentedBy" style="display: none;">Presented by: Bachu Singh 🎬</div>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="container">
        <div class="quiz-header">
            <h1>Likely Scam 😁</h1>
            <p id="participantName"></p>
        </div>

        <div class="progress-bar">
            <div class="progress-text">
                <span>Question <span id="currentQuestion">0</span> of <span id="totalQuestions">0</span></span>
                <span id="scoreDisplay">Score: 0</span>
            </div>
            <div class="progress-fill">
                <div class="progress-fill-bar" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="question-card" id="questionCard">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="button-group">
                <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()">← Previous</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
            </div>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="resultsScreen" class="container" style="display: none;">
        <div class="question-card">
            <div class="results-container">
                <h2 id="resultTitle">Quiz Completed! 🎉</h2>
                <div class="score-circle">
                    <div class="score-number" id="finalScore">0</div>
                    <div class="score-text">Correct</div>
                </div>
                <div class="score-percentage" id="percentage">0%</div>
                <div class="message" id="resultMessage"></div>
                
                <div class="results-details">
                    <p>
                        <span>Total Questions:</span>
                        <strong id="detailTotal">0</strong>
                    </p>
                    <p>
                        <span>Correct Answers:</span>
                        <strong id="detailCorrect">0</strong>
                    </p>
                    <p>
                        <span>Wrong Answers:</span>
                        <strong id="detailWrong">0</strong>
                    </p>
                </div>

                <button class="btn btn-primary leaderboard-btn" onclick="viewLeaderboard()">View Leaderboard 🏆</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏆 Leaderboard</h2>
                <button class="close-btn" onclick="closeLeaderboard()">×</button>
            </div>
            <div id="leaderboardContent"></div>
        </div>
    </div>

    <script>
        let currentQuestionIndex = 0;
        let questions = [];
        let answers = [];
        let score = 0;
        let participantName = '';
        const MEDALS = ['🥇', '🥈', '🥉'];

        // Matrix character generation
        function generateMatrixCode() {
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            let code = '';
            for (let i = 0; i < 1000; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function createMatrixBackground() {
            const bg = document.getElementById('matrixBg');
            const columns = Math.floor(window.innerWidth / 20);
            let matrixText = '';
            
            for (let i = 0; i < columns * 30; i++) {
                matrixText += generateMatrixCode().substring(0, 1) + '\n';
            }
            
            bg.textContent = matrixText;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initializeQuiz();
        });

        function checkAuth() {
            if (sessionStorage.getItem('userRole') !== 'participant') {
                window.location.href = 'index.html';
            }
            participantName = sessionStorage.getItem('participantName') || 'Participant';
            document.getElementById('participantName').textContent = participantName;
        }

        function initializeQuiz() {
            // Show matrix loading screen for 20 seconds
            document.getElementById('loadingScreen').style.display = 'flex';
            createMatrixBackground();

            // At 15 seconds, show joke message
            setTimeout(() => {
                document.getElementById('hackedMsg').style.display = 'none';
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('jokeMsg').style.display = 'block';
                document.getElementById('presentedBy').style.display = 'block';
            }, 15000);

            // At 20 seconds, load actual quiz
            setTimeout(() => {
                questions = JSON.parse(localStorage.getItem('questions') || '[]');

                if (questions.length === 0) {
                    alert('No questions available. The admin needs to create questions first.');
                    window.location.href = 'index.html';
                    return;
                }

                answers = new Array(questions.length).fill(null);
                score = 0;
                currentQuestionIndex = 0;
                loadQuestion();
                showQuizScreen();
            }, 20000);
        }

        function showQuizScreen() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
        }

        function showResultsScreen() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
        }

        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('questionText').textContent = question.text;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = questions.length;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = question.options.map((option, index) => {
                const isSelected = answers[currentQuestionIndex] === index;
                return `
                    <label class="option ${isSelected ? 'selected' : ''}">
                        <input type="radio" name="option" value="${index}" 
                            ${isSelected ? 'checked' : ''} 
                            onchange="selectAnswer(${index})">
                        <label style="margin: 0;">${option}</label>
                    </label>
                `;
            }).join('');

            updateProgress();
            updateButtons();
        }

        function selectAnswer(index) {
            answers[currentQuestionIndex] = index;
            loadQuestion();
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = answers[currentQuestionIndex] === null;

            if (currentQuestionIndex === questions.length - 1) {
                document.getElementById('nextBtn').textContent = 'Submit Quiz ✓';
            } else {
                document.getElementById('nextBtn').textContent = 'Next →';
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (answers[currentQuestionIndex] === null) {
                alert('Please select an answer before proceeding!');
                return;
            }

            if (currentQuestionIndex === questions.length - 1) {
                submitQuiz();
            } else {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function submitQuiz() {
            // Calculate score
            score = 0;
            for (let i = 0; i < questions.length; i++) {
                if (answers[i] === questions[i].correct) {
                    score++;
                }
            }

            // Save result
            const result = {
                name: participantName,
                score: score,
                total: questions.length,
                completedAt: new Date().toISOString()
            };

            let results = JSON.parse(localStorage.getItem('results') || '[]');
            results.push(result);
            localStorage.setItem('results', JSON.stringify(results));

            // Show results
            displayResults();
            showResultsScreen();
        }

        function displayResults() {
            const percentage = Math.round((score / questions.length) * 100);
            let message = '';

            if (percentage === 100) {
                message = "🎯 Perfect Score! You know them so well!";
            } else if (percentage >= 80) {
                message = "🌟 Excellent! You know them very well!";
            } else if (percentage >= 60) {
                message = "👍 Good! You know them pretty well!";
            } else if (percentage >= 40) {
                message = "📚 Not bad! You could learn more about them!";
            } else {
                message = "💭 Looks like you need to spend more time together!";
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('percentage').textContent = percentage + '%';
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('detailTotal').textContent = questions.length;
            document.getElementById('detailCorrect').textContent = score;
            document.getElementById('detailWrong').textContent = questions.length - score;
        }

        function viewLeaderboard() {
            const results = JSON.parse(localStorage.getItem('results') || '[]');
            const sorted = [...results].sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return new Date(a.completedAt) - new Date(b.completedAt);
            });

            const content = document.getElementById('leaderboardContent');
            if (sorted.length === 0) {
                content.innerHTML = '<div class="empty-message">No scores yet.</div>';
            } else {
                content.innerHTML = sorted.map((r, index) => {
                    const percentage = Math.round((r.score / r.total) * 100);
                    let medal = '';
                    let badgeClass = '';

                    if (index === 0) {
                        medal = MEDALS[0];
                        badgeClass = 'first';
                    } else if (index === 1) {
                        medal = MEDALS[1];
                        badgeClass = 'second';
                    } else if (index === 2) {
                        medal = MEDALS[2];
                        badgeClass = 'third';
                    }

                    return `
                        <div class="leaderboard-item">
                            <div class="rank-badge ${badgeClass}">
                                ${medal || '#' + (index + 1)}
                            </div>
                            <div class="leaderboard-info">
                                <h4>${r.name}</h4>
                                <div style="font-size: 0.9em; color: #666;">${percentage}% (${r.score}/${r.total})</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('leaderboardModal').style.display = 'block';
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('leaderboardModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
